config:
  warningsAsErrors: true

output-reports:
  active: true

comments:
  # Applies to the whole of src/main. Tests are excluded: their backtick names
  # already state intent, and a KDoc above `fun \`pauses mid interval\`()` would
  # only restate it.
  UndocumentedPublicClass:
    active: true
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    searchInProtectedClass: true
  UndocumentedPublicFunction:
    active: true
    searchProtectedFunction: true
  UndocumentedPublicProperty:
    active: true
    searchProtectedProperty: true

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: [ "Composable" ]
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15

naming:
  FunctionNaming:
    ignoreAnnotated: [ "Composable" ]

style:
  MagicNumber:
    ignoreAnnotated: [ "Composable" ]
    ignorePropertyDeclaration: true
    ignoreNumbers: [ "-1", "0", "1", "2", "20", "59", "60", "99", "100", "1000", "5000" ]
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    active: true
