version: 2

updates:
  # Gradle: Dependabot reads gradle/libs.versions.toml directly.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Must target dev. Dependabot defaults to the default branch, but this repo's
    # rule is that main only advances via a release PR from dev - PRs opened against
    # main would bypass dev CI entirely.
    target-branch: dev
    # Must set a type. Dependabot's default subject is "Bump x from 1.0 to 1.1",
    # which is not a Conventional Commit, so both the commit-msg hook and
    # commit-lint.yml would reject every PR it opens.
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      # These are not independent. Hilt 2.60 requires AGP 9, AGP 9 requires a matching
      # Kotlin, and the Compose BOM tracks the Kotlin compiler plugin. Split across
      # PRs, each one merges into a dev branch that does not build. Learned the hard
      # way in v3.1.0, where nine separate Dependabot PRs had to be folded into one
      # branch by hand. Majors included on purpose: this is exactly the group where a
      # major bump arrives and drags the rest with it.
      toolchain:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "com.google.dagger*"
          - "androidx.compose*"
        update-types:
          - major
          - minor
          - patch

      # One PR a week for routine bumps rather than one per dependency. Majors stay
      # separate: they are the ones that actually need reading.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keeps the pinned action versions in dev-ci.yml, release.yml and commit-lint.yml
  # from silently ageing out.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 5
    # codeql-action is deliberately tracked at its floating major tag. It ships a
    # patch every week or two, mostly to advance the bundled query pack, and the
    # major tag picks those up without a PR each time. Left alone, Dependabot
    # rewrites `@v4` to an exact patch and then churns on it forever.
    ignore:
      - dependency-name: "github/codeql-action"
    groups:
      actions:
        update-types:
          - minor
          - patch
