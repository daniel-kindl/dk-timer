name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    # Dev prereleases are tagged v3.0.0-dev.12 and also match the v* filter above,
    # which GitHub's tag patterns cannot express an exception to. Without this guard
    # every push to `dev` starts this workflow and fails it on the SemVer check.
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance: it mints an OIDC token to
      # prove the run's identity and writes the resulting attestation back to the
      # repository's attestation store.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate SemVer tag and version consistency
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          # 1. Tag must be strict SemVer MAJOR.MINOR.PATCH (https://semver.org/)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not valid SemVer (expected vMAJOR.MINOR.PATCH, see https://semver.org/)"
            exit 1
          fi

          NEW_VERSION="${TAG#v}"
          IFS='.' read -r NEW_MAJOR NEW_MINOR NEW_PATCH <<< "$NEW_VERSION"

          # 2. Tag must match versionName in app/build.gradle.kts
          BUILD_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ "$BUILD_VERSION" != "$NEW_VERSION" ]]; then
            echo "::error::Tag $TAG does not match versionName \"$BUILD_VERSION\" in app/build.gradle.kts"
            exit 1
          fi

          # --exclude='*-*' skips dev prereleases, which would otherwise resolve as
          # the previous tag and break both the monotonic check and the bump-level
          # check below.
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' HEAD^ 2>/dev/null || echo "")

          if [[ -n "$PREV_TAG" ]]; then
            PREV_VERSION="${PREV_TAG#v}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$PREV_VERSION"

            # 3. New version must be strictly greater than the previous release
            if (( NEW_MAJOR < PREV_MAJOR )) || \
               (( NEW_MAJOR == PREV_MAJOR && NEW_MINOR < PREV_MINOR )) || \
               (( NEW_MAJOR == PREV_MAJOR && NEW_MINOR == PREV_MINOR && NEW_PATCH <= PREV_PATCH )); then
              echo "::error::New version $NEW_VERSION is not greater than previous release $PREV_VERSION"
              exit 1
            fi

            if (( NEW_MAJOR > PREV_MAJOR )); then
              ACTUAL_BUMP="major"
            elif (( NEW_MINOR > PREV_MINOR )); then
              ACTUAL_BUMP="minor"
            else
              ACTUAL_BUMP="patch"
            fi

            # 4. Bump level must match what the commits since PREV_TAG require,
            #    per Conventional Commits (https://www.conventionalcommits.org/en/v1.0.0/):
            #    a "type!:" subject or "BREAKING CHANGE:" footer requires major,
            #    a "feat:" commit requires at least minor, anything else needs at least patch.
            REQUIRED_BUMP="patch"

            while IFS= read -r subject; do
              [[ -z "$subject" ]] && continue
              if [[ "$subject" =~ ^[a-z]+(\([a-zA-Z0-9._-]+\))?!: ]]; then
                REQUIRED_BUMP="major"
              elif [[ "$subject" =~ ^feat(\([a-zA-Z0-9._-]+\))?: ]] && [[ "$REQUIRED_BUMP" != "major" ]]; then
                REQUIRED_BUMP="minor"
              fi
            done < <(git log --no-merges --pretty=format:"%s" "$PREV_TAG"..HEAD)

            if git log --no-merges --pretty=format:"%b" "$PREV_TAG"..HEAD | grep -q "^BREAKING CHANGE:"; then
              REQUIRED_BUMP="major"
            fi

            rank() { case "$1" in major) echo 3 ;; minor) echo 2 ;; patch) echo 1 ;; esac; }

            if (( $(rank "$ACTUAL_BUMP") < $(rank "$REQUIRED_BUMP") )); then
              echo "::error::Commits since $PREV_TAG require at least a $REQUIRED_BUMP bump, but $TAG is only a $ACTUAL_BUMP bump"
              exit 1
            fi
          else
            echo "No previous tag found; skipping monotonic/bump-level checks for the first release."
          fi

          echo "Version checks passed for $TAG"

      - name: Run full test suite
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository secrets to sign releases (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"
          echo "KEYSTORE_FILE=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Compute SHA-256 checksum
        id: checksum
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          # `sha256sum -c` resolves the path in the file relative to the working
          # directory, so the digest is generated from inside the APK's own
          # directory to keep the recorded name bare.
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "SHA256_LINE=$(cat "${APK}.sha256")" >> "$GITHUB_OUTPUT"
          # Printed here on purpose. The job log is a second, independent record of
          # the digest: it is public, immutable once the run finishes, and not
          # editable the way a release asset is.
          echo "===== SHA-256 of the published APK ====="
          cat "${APK}.sha256"
          echo "========================================"

      # Ties the APK to this workflow run, this commit and this repository with a
      # signature users can check via `gh attestation verify`. Unlike the checksum,
      # this cannot be reproduced by someone who only controls the release assets.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: app/build/outputs/apk/release/*.apk

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits
        id: changelog
        run: |
          # --exclude='*-*' so dev prereleases cannot become the comparison point and
          # truncate the notes to the handful of commits since the last dev build.
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline "$PREV_TAG"..HEAD --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges)
          fi
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "CHANGES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Created as a draft and published in the next step. GitHub makes a release
      # immutable the moment it is published, so a single-step publish uploads the
      # first asset and then fails on the second, leaving a release users cannot
      # download anything from. Drafts stay writable, so all assets land first.
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Ocho ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGES }}

            ## Verifying this download

            SHA-256 of the APK, also attached as a `.sha256` file and printed in
            the build log for [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}):

            ```
            ${{ steps.checksum.outputs.SHA256_LINE }}
            ```

            Build provenance is attested. Verify it with:

            ```
            gh attestation verify <apk> --repo ${{ github.repository }}
            ```

            See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            for what each check does and does not prove.

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREV_TAG }}...${{ steps.version.outputs.VERSION }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          draft: true
          prerelease: false

      # Publishing creates the tag's release entry and marks it latest, which is the
      # endpoint the stable channel's updater reads.
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.version.outputs.VERSION }}" \
            --draft=false --prerelease=false --latest
