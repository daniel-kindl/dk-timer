org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support, which is incompatible with kapt. Opting out
# keeps the existing Kotlin and kapt setup working while the KSP migration is done
# separately. See https://developer.android.com/r/tools/built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
